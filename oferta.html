<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="0; url=/">
    <title>Redirecionando...</title>
    <!-- Entre 16 e 17/08/2026 a raiz foi uma VSL e a loja morou aqui. A VSL foi
         removida e a loja voltou pra raiz, mas este endereco continua existindo
         por causa de quem clicou no botao da VSL nesse periodo e guardou o link.
         Mesma logica do /ativar/: leva as UTMs junto, senao a venda de quem
         chegar por aqui entra como organica. -->
    <script>
        window.location.replace('/' + window.location.search + window.location.hash);
    </script>
</head>
<body>
    <p>Redirecionando para a loja... <a href="/">Clique aqui se não for redirecionado</a>.</p>
</body>
</html>
