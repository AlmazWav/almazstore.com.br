<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/">
    <title>Redirecionando...</title>
    <script>
        // Redireciona para a página principal, mantendo os parâmetros de rastreamento (UTMs)
        window.location.replace('/' + window.location.search + window.location.hash);
    </script>
</head>
<body>
    <p>Redirecionando para a página principal... <a href="/">Clique aqui se não for redirecionado</a>.</p>
</body>
</html>
