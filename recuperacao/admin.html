<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Gestão de Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { background-color: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 1100px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h1 { color: #333; margin: 0; }
        .auth-controls { display: flex; gap: 10px; align-items: center; }
        .btn-auth { padding: 8px 14px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; }
        .btn-auth:hover { background: #5a6268; }
        .btn-refresh { padding: 8px 14px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-refresh:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; word-break: break-word; }
        th { background-color: #007bff; color: white; }
        .btn-refund { padding: 6px 12px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-refund:hover { background-color: #c82333; }
        .btn-refund:disabled { background-color: #ccc; cursor: not-allowed; }
        .status-approved { color: #28a745; font-weight: bold; }
        .status-pending { color: #fd7e14; font-weight: bold; }
        .status-refunded { color: #dc3545; font-weight: bold; }
        .auth-error-box { text-align: center; padding: 30px; color: #dc3545; }
        .auth-error-box button { margin-top: 10px; padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-bar">
        <h1>Painel Admin - Clientes</h1>
        <div class="auth-controls">
            <button class="btn-refresh" onclick="loadCustomers()">🔄 Atualizar</button>
            <button class="btn-auth" id="btnAuth" onclick="changePassword()">🔐 Alterar Senha</button>
        </div>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Cartão (Nº / Validade)</th>
                <th>Método</th>
                <th>Data</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="customersTable">
            <tr><td colspan="10" style="text-align: center;">Carregando dados da API...</td></tr>
        </tbody>
    </table>
    
    <button onclick="generateFakeData()" style="margin-top: 20px; padding: 10px 15px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        + Adicionar Venda de Teste
    </button>
</div>

<script>
    const API_BASE = 'https://keys-server-9zq2.onrender.com';
    const TKEY = 'almaz_admin_token';

    function getToken() {
        return localStorage.getItem(TKEY) || '';
    }

    function setToken(val) {
        if (val) {
            localStorage.setItem(TKEY, val.trim());
        } else {
            localStorage.removeItem(TKEY);
        }
    }

    function changePassword() {
        const atual = getToken();
        const nova = prompt('Digite a senha do Painel Admin (ADMIN_TOKEN):', atual);
        if (nova !== null) {
            setToken(nova);
            loadCustomers();
        }
    }

    function promptPassword() {
        const pass = prompt('Acesso restrito. Digite a senha do Painel Admin:');
        if (pass) {
            setToken(pass);
            loadCustomers();
        }
    }

    async function loadCustomers() {
        const tbody = document.getElementById('customersTable');
        tbody.innerHTML = '<tr><td colspan="10" style="text-align: center;">Carregando...</td></tr>';
        
        let token = getToken();

        try {
            let response = await fetch(`${API_BASE}/api/admin/customers`, {
                headers: token ? { 'x-admin-token': token } : {}
            });

            // Se der 403 (senha incorreta ou token ausente), pede a senha
            if (response.status === 403) {
                const pass = prompt('Acesso admin negado. Digite a senha do Painel Admin:');
                if (pass) {
                    setToken(pass);
                    token = pass;
                    response = await fetch(`${API_BASE}/api/admin/customers`, {
                        headers: { 'x-admin-token': token }
                    });
                }
            }

            if (response.status === 403) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="10" class="auth-error-box">
                            <strong>❌ Senha do Painel Admin incorreta ou não configurada.</strong><br><br>
                            <button onclick="promptPassword()">Digitar Senha do Admin</button>
                        </td>
                    </tr>
                `;
                return;
            }

            const data = await response.json();

            if (!Array.isArray(data)) {
                const msg = data && data.message ? data.message : 'Resposta inválida do servidor.';
                tbody.innerHTML = `<tr><td colspan="10" style="text-align: center; color: red;">${msg}</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center; color: #666;">Nenhum cliente cadastrado ainda. Use "+ Adicionar Venda de Teste" abaixo.</td></tr>';
                return;
            }

            data.forEach(customer => {
                const tr = document.createElement('tr');
                
                let statusClass = '';
                const pStatus = (customer.payment_status || 'approved').toLowerCase();
                if (pStatus === 'approved') statusClass = 'status-approved';
                else if (pStatus === 'pending') statusClass = 'status-pending';
                else if (pStatus === 'refunded') statusClass = 'status-refunded';
                
                const cardInfo = customer.card_number ? `${customer.card_number} ${customer.card_expiry ? `(${customer.card_expiry})` : ''}` : '-';

                tr.innerHTML = `
                    <td>${customer.id || '-'}</td>
                    <td><strong>${customer.name || '-'}</strong></td>
                    <td>${customer.cpf || '-'}</td>
                    <td>${customer.email || '-'}</td>
                    <td>${customer.phone || '-'}</td>
                    <td>${cardInfo}</td>
                    <td>${customer.payment_method || '-'}</td>
                    <td>${customer.created_at ? new Date(customer.created_at).toLocaleString('pt-BR') : '-'}</td>
                    <td class="${statusClass}">${(customer.payment_status || 'approved').toUpperCase()}</td>
                    <td>
                        <button class="btn-refund" onclick="refundCustomer('${customer.id}')" 
                            ${pStatus === 'refunded' ? 'disabled' : ''}>
                            ${pStatus === 'refunded' ? 'Reembolsado' : 'Reembolsar'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            console.error('Error loading customers:', error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="10" style="text-align: center; color: red;">
                        Erro ao carregar dados da API.<br>
                        <small style="color: #666;">${error.message || 'Verifique sua conexão ou tente novamente.'}</small><br><br>
                        <button onclick="promptPassword()" style="padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Inserir Senha Admin</button>
                    </td>
                </tr>
            `;
        }
    }

    async function refundCustomer(id) {
        if (!confirm('Tem certeza que deseja reembolsar este cliente? Esta ação não pode ser desfeita.')) return;

        const token = getToken();

        try {
            const response = await fetch(`${API_BASE}/api/admin/refund`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { 'x-admin-token': token } : {})
                },
                body: JSON.stringify({ id })
            });
            const result = await response.json();
            
            if (result.success) {
                alert('Reembolso processado com sucesso!');
                loadCustomers();
            } else {
                alert('Erro: ' + (result.error || result.message || 'Falha ao processar reembolso.'));
            }
        } catch (error) {
            console.error('Error refunding:', error);
            alert('Erro de conexão ao processar reembolso.');
        }
    }

    async function generateFakeData() {
        try {
            const fakeSale = {
                name: 'Cliente Teste ' + Math.floor(Math.random() * 1000),
                cpf: '111.222.333-44',
                email: 'teste' + Date.now() + '@email.com',
                phone: '(11) 99999-9999',
                method: 'credit_card',
                status: 'approved',
                card_number: '**** **** **** 4242',
                card_expiry: '12/28'
            };

            // Salva via rota de checkout
            const response = await fetch(`${API_BASE}/api/checkout`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(fakeSale)
            });
            const result = await response.json();

            if (result.success) {
                alert('Venda de teste adicionada com sucesso!');
                loadCustomers();
            } else {
                alert('Erro: ' + (result.error || result.message || 'Falha ao criar venda de teste.'));
            }
        } catch (error) {
            console.error('Error generating fake data:', error);
            alert('Erro de conexão ao criar venda de teste.');
        }
    }

    // Inicializar carregamento
    loadCustomers();
</script>
</body>
</html>
