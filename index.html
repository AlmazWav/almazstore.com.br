<!-- ===================== RASTREAMENTO =====================
     Os tres blocos abaixo sao copia fiel do oferta.html. Como o anuncio passa a
     cair AQUI primeiro, e aqui que o pixel precisa ver a visita e a UTMify
     precisa costurar o _id do lead dentro do utm_source. O botao leva a
     querystring inteira pra oferta, entao a costura feita aqui segue junto e a
     venda continua casada com esta visita. Se mexer num, mexa no outro. -->

<!-- Utmify Pixel -->
<script>
  window.pixelId = "6a185fdf262a79a6a040ba4e";
  var a = document.createElement("script");
  a.setAttribute("async", "");
  a.setAttribute("defer", "");
  a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
  document.head.appendChild(a);
</script>

<!-- Utmify UTMs -->
<script
  src="https://cdn.utmify.com.br/scripts/utms/latest.js"
  data-utmify-prevent-xcod-sck
  data-utmify-prevent-subids
  async
  defer
></script>

<!-- Utmify Lead Stitching (script do suporte UTMify) -->
<script>
(function () {
  const POLL_MS = 500;
  const MAX_ATTEMPTS = 40; // ~20s; evita timer infinito apos a costura

  function getStorageKey() {
    const url = new URL(window.location.href);
    const current = url.searchParams.get("utm_source");
    if (current === "FB") return "lead";
    if (current === "google") return "lead-google";
    return null;
  }

  function getLeadId(storageKey) {
    if (!storageKey) return null;
    const raw = localStorage.getItem(storageKey);
    if (!raw) return null;
    try {
      const obj = JSON.parse(raw);
      return obj && obj._id ? String(obj._id) : null;
    } catch {
      return null;
    }
  }

  function applyUtmIfNeeded() {
    const url = new URL(window.location.href);
    const current = url.searchParams.get("utm_source");
    const storageKey = getStorageKey();
    const id = getLeadId(storageKey);
    if (!id) return false;

    let desired = null;
    if (current === "FB") {
      desired = "FBjLj" + id;
    } else if (current === "google") {
      desired = "googlejLj" + id;
    }

    if (!desired) return false;

    url.searchParams.set("utm_source", desired);
    window.location.replace(url.toString());
    return true;
  }

  if (applyUtmIfNeeded()) return;

  let attempts = 0;
  const interval = setInterval(() => {
    attempts++;
    if (applyUtmIfNeeded() || getStorageKey() === null || attempts >= MAX_ATTEMPTS) {
      clearInterval(interval);
    }
  }, POLL_MS);
})();
</script>

<style>
/* Mesmo sistema visual do site (azul grafite + CTA verde), reduzido ao osso:
   nesta pagina so existem video e botao. Qualquer coisa a mais aqui rouba
   clique do CTA. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b1219; --bg2:#0f1a24; --panel:#16222f; --panel2:#1d2b3a;
  --line:rgba(146,186,220,.13); --line2:rgba(146,186,220,.22);
  --txt:#dbe6f1; --txt2:#aebfd0; --dim:#8399ae;
  --blue:#59a6e0; --buy:#4a9d2a; --buy2:#57b533;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:10px;
}
body{
  font-family:var(--f);background:var(--bg);color:var(--txt);line-height:1.5;
  font-size:16px;-webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:18px 16px calc(26px + env(safe-area-inset-bottom));
}
button{font-family:inherit;border:none;cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}

.topo{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.topo img{width:30px;height:30px;border-radius:7px}
.topo b{font-size:15px;font-weight:700;letter-spacing:-.01em}

h1{
  font-size:clamp(20px,5.4vw,26px);font-weight:700;line-height:1.25;
  letter-spacing:-.02em;text-align:center;max-width:440px;margin-bottom:4px;
}
h1 span{color:var(--buy2)}

/* ---------- video ----------
   A altura manda, e nao a largura: o video precisa caber junto com o botao numa
   tela so. CTA abaixo da dobra numa VSL e o mesmo que nao ter CTA, porque quase
   ninguem rola numa pagina que so tem video. */
.player{
  position:relative;height:min(64vh,600px);width:auto;aspect-ratio:480/854;
  max-width:100%;
  background:#000;border:1px solid var(--line2);border-radius:14px;overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.player video{width:100%;height:100%;display:block;object-fit:cover}

/* Aviso de som. Ocupa o video inteiro pra qualquer toque valer, e escurece de
   leve so pro botao ter contraste. Sem borrao e sem tela intermediaria: um
   toque liga o som e o video volta pro comeco. */
.som{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 50%,rgba(4,8,12,.10),rgba(4,8,12,.55));
  transition:opacity .25s;cursor:pointer;
}
.som.off{opacity:0;pointer-events:none}
.som-btn{
  display:flex;flex-direction:column;align-items:center;gap:12px;background:none;
}
.som-circ{
  position:relative;width:72px;height:72px;border-radius:50%;
  background:rgba(255,255,255,.97);display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}
/* anel que pulsa: puxa o olho pro botao sem piscar a tela inteira */
.som-circ::after{
  content:'';position:absolute;inset:-9px;border-radius:50%;
  border:2px solid rgba(255,255,255,.55);animation:anel 2s ease-out infinite;
}
@keyframes anel{
  0%{transform:scale(.92);opacity:.9}
  70%{transform:scale(1.22);opacity:0}
  100%{opacity:0}
}
.som-circ svg{width:32px;height:32px;fill:#0b1219;margin-left:2px}
.som-txt{
  font-size:15px;font-weight:600;color:#fff;letter-spacing:.01em;
  text-shadow:0 2px 10px rgba(0,0,0,.75);
}
@media(prefers-reduced-motion:reduce){ .som-circ::after{animation:none;opacity:.5} }

/* Botao de repetir, aparece quando o video acaba */
.replay{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(4,8,12,.55);
}
.replay.on{display:flex}
.replay button{
  background:rgba(255,255,255,.95);color:#0b1219;font-weight:700;font-size:14.5px;
  padding:11px 20px;border-radius:50px;
}

/* ---------- CTA ---------- */
.cta-area{width:100%;max-width:380px;margin-top:16px}
.cta{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  background:linear-gradient(180deg,var(--buy2),var(--buy));color:#fff;
  font-weight:700;font-size:17px;letter-spacing:.01em;
  padding:17px 20px;border-radius:var(--r);border:1px solid rgba(0,0,0,.25);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset,0 6px 18px rgba(0,0,0,.4);
  transition:filter .15s,transform .1s;text-align:center;
}
.cta:hover{filter:brightness(1.08)}
.cta:active{transform:translateY(1px)}
.pe{font-size:13px;color:var(--dim);text-align:center;margin-top:12px;line-height:1.6}
.pe b{color:var(--txt2);font-weight:600}

/* Telas baixas (celular antigo, ou navegador com barra grande): encolhe o que
   nao e video nem botao, em vez de empurrar o CTA pra fora da tela. */
@media(max-height:700px){
  body{padding-top:12px}
  .topo{margin-bottom:10px}
  .topo img{width:26px;height:26px}
  h1{font-size:19px}
  .sub{margin-bottom:9px}
  .player{height:62vh}
  .cta{padding:15px 18px;font-size:16px}
  .pe{font-size:12px;margin-top:9px}
}
@media(min-width:760px){
  body{padding-top:30px}
  .player{height:min(64vh,620px)}
  .cta-area{max-width:400px}
}
</style>

<body>

<div class="topo">
  <img src="assets/logo-128.png" alt="Almaz Store">
  <b>Almaz Store</b>
</div>

<h1>Mais de <span>40.000 jogos</span> originais na sua conta Steam</h1>

<div class="player" id="player">
  <video id="v"
         src="https://i.imgur.com/Q7siebS.mp4"
         playsinline muted autoplay preload="auto"
         poster=""></video>

  <div class="som" id="som">
    <button type="button" class="som-btn" id="som-btn">
      <span class="som-circ">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.5 7-8.8s-3-7.8-7-8.8z"/></svg>
      </span>
      <span class="som-txt" id="som-txt">Toque para ativar o som</span>
    </button>
  </div>

  <div class="replay" id="replay">
    <button type="button" id="replay-btn">Ver de novo</button>
  </div>
</div>

<div class="cta-area">
  <a href="oferta.html" class="cta" id="cta">Quero ver como funciona</a>
  <p class="pe"><b>7 dias de garantia.</b> PIX cai na hora e o acesso é liberado no seu e-mail.</p>
</div>

<script>
(function(){
  var v = document.getElementById('v');
  var som = document.getElementById('som');
  var replay = document.getElementById('replay');
  var cta = document.getElementById('cta');

  /* O botao carrega a querystring inteira pra pagina da oferta. Sem isso, quem
     veio do anuncio chega na oferta SEM utm, a UTMify perde o rastro e a venda
     aparece como organica. E o pedaco mais importante desta pagina. */
  function levarUtms(){
    var q = location.search || '';
    cta.setAttribute('href', 'oferta.html' + q);
  }
  levarUtms();

  /* Autoplay so passa mudo, entao o video que roda antes do toque e so chamariz.
     Quando a pessoa liga o som, o video VOLTA PRO COMECO: ela vai ouvir a VSL
     inteira, desde a primeira frase, que e onde mora o gancho. */
  function ligarSom(){
    v.muted = false;
    v.volume = 1;
    v.currentTime = 0;
    var p = v.play();
    if(p && p['catch']) p['catch'](function(){});
    som.classList.add('off');
    replay.classList.remove('on');
    if(window.clarity) try{ window.clarity('set','vsl','som-ligado'); }catch(e){}
  }
  document.getElementById('som-btn').addEventListener('click', ligarSom);
  /* tocar em qualquer lugar do video tambem liga o som, enquanto o aviso estiver la */
  document.getElementById('player').addEventListener('click', function(e){
    if(!som.classList.contains('off') && !e.target.closest('#replay')) ligarSom();
  });

  v.addEventListener('ended', function(){ replay.classList.add('on'); });
  document.getElementById('replay-btn').addEventListener('click', function(e){
    e.stopPropagation();
    replay.classList.remove('on');
    v.currentTime = 0;
    v.play()['catch'](function(){});
  });

  /* Se o navegador barrar ate o autoplay mudo, o aviso vira "toque para assistir"
     e o primeiro toque ja comeca com som. */
  var tentativa = v.play();
  if(tentativa && tentativa['catch']) tentativa['catch'](function(){
    document.getElementById('som-txt').textContent = 'Toque para assistir';
  });
})();
</script>
</body>
